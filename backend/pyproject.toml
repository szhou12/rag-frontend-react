[project]
name = "backend"
version = "0.1.0"
description = "Backend Dependencies Management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "pydantic>=2.11.1",
    "pydantic-settings>=2.8.1",
    "pyjwt>=2.10.1",
    "pymysql>=1.1.1",
    "sqlmodel>=0.0.24",
    # passlib==1.7.4 ONLY supports bcrypt==4.0.1
    "bcrypt==4.0.1",
    "passlib[bcrypt]>=1.7.4",
    "alembic>=1.15.2", # DB version control and migration
    "sqlalchemy>=2.0.40",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1.0",
    "chromadb>=1.0.20",
    "sentence-transformers>=5.1.0",
    "langchain>=0.3.27",
    "langchain-core>=0.3.75",
    "langchain-aws>=0.2.31",
    "langchain-huggingface>=0.3.1",
    "langchain-chroma>=0.2.5",
    "langchain-docling>=1.1.0",
    "langchain-community>=0.3.29",
    "pymupdf>=1.26.4",
    "markitdown[all]>=0.1.3",
]
